<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>國中國文成語簡易練習測驗</title>

  <!-- 指定的 Google Fonts；LXGW WenKai Mono TC 為主要字型，Isometra 為備援字型。 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Isometra&family=LXGW+WenKai+Mono+TC&display=swap" rel="stylesheet">

  <!-- p5.js 只負責畫面、動畫與滑鼠／觸控互動；題庫由 sketch.js 的 fetch() 讀取 Google Sheets。 -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.min.js"></script>

  <style>
    /* html、body 與 canvas 無邊距，讓 p5.js 畫布填滿電腦、平板與手機畫面。 */
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #cfbaf0;
    }

    body {
      font-family: "LXGW WenKai Mono TC", "Isometra", sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>
  <!-- 不載入 本機題庫檔；sketch.js 會直接 fetch() Google Sheets CSV endpoint。 -->
  <script src="sketch.js"></script>
</body>
</html>
